<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vượt Link Kiếm Tiền</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { font-family: sans-serif; background: #0f172a; color: #fff; margin: 0; padding: 15px; }
        .header { display: flex; justify-content: space-between; align-items: center; padding-bottom: 15px; border-bottom: 1px solid #334155; }
        .user-info { display: flex; align-items: center; gap: 10px; }
        .avatar { width: 40px; height: 40px; background: #38bdf8; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; color: #0f172a; }
        .coin-box { background: #0284c7; padding: 6px 12px; border-radius: 20px; font-weight: bold; font-size: 14px; }
        .nav { display: flex; gap: 10px; margin: 15px 0; border-bottom: 1px solid #334155; padding-bottom: 10px; overflow-x: auto; }
        .nav button { background: transparent; border: none; color: #94a3b8; font-weight: bold; padding: 8px 12px; cursor: pointer; }
        .nav button.active { color: #38bdf8; border-bottom: 2px solid #38bdf8; }
        .admin-btn { background: #eab308 !important; color: #000 !important; border-radius: 6px; display: none; }
        .task-card { background: #1e293b; padding: 15px; border-radius: 10px; margin-bottom: 10px; border: 1px solid #334155; }
        .task-card h4 { margin: 0 0 5px 0; color: #f8fafc; }
        .task-card p { margin: 0 0 10px 0; color: #38bdf8; font-size: 14px; }
        .btn-do { background: #22c55e; color: #fff; border: none; padding: 8px 15px; border-radius: 6px; font-weight: bold; width: 100%; cursor: pointer; }
    </style>
</head>
<body>

    <div class="header">
        <div class="user-info">
            <div class="avatar" id="u-avatar">D</div>
            <div>
                <strong id="u-name">Đang tải...</strong><br>
                <small style="color: #94a3b8;">ID: <span id="u-id">...</span></small>
            </div>
        </div>
        <div class="coin-box">🪙 <span id="u-dcoin">0</span> DCOIN</div>
    </div>

    <div class="nav">
        <button class="active">Nhiệm Vụ</button>
        <button>Rút Tiền</button>
        <button>Lịch Sử</button>
        <button>BXH</button>
        <button id="admin-tab-btn" class="admin-btn">👑 ADMIN</button>
    </div>

    <div id="tasks-container">
        <p style="text-align: center; color: #94a3b8; padding: 20px;">Đang kết nối dữ liệu...</p>
    </div>

    <script>
        const API = "https://vuotlinkkiemtien.vercel.app";
        const tg = window.Telegram?.WebApp;
        if (tg) tg.expand();

        const user = tg?.initDataUnsafe?.user || { id: "8914123780", first_name: "DA ⚔ PRO" };

        // Hiển thị thông tin cơ bản ngay lập tức
        document.getElementById('u-name').innerText = user.first_name || 'User';
        document.getElementById('u-id').innerText = user.id;
        document.getElementById('u-avatar').innerText = (user.first_name || 'U').charAt(0).toUpperCase();

        // Mở Tab Admin nếu là ID của bạn
        if (String(user.id) === "8914123780") {
            document.getElementById('admin-tab-btn').style.display = 'inline-block';
        }

        const headers = {
            'Content-Type': 'application/json',
            'x-telegram-id': String(user.id),
            'x-telegram-name': encodeURIComponent(user.first_name || '')
        };

        async function initApp() {
            try {
                // 1. Lấy Coin
                const resUser = await fetch(`${API}/api/user/info`, { headers });
                const dataUser = await resUser.json();
                if (dataUser.dcoin !== undefined) {
                    document.getElementById('u-dcoin').innerText = dataUser.dcoin;
                }

                // 2. Lấy Danh sách Nhiệm vụ
                const resTasks = await fetch(`${API}/api/tasks`, { headers });
                const tasks = await resTasks.json();
                const container = document.getElementById('tasks-container');

                if (Array.isArray(tasks) && tasks.length > 0) {
                    container.innerHTML = tasks.map(t => `
                        <div class="task-card">
                            <h4>${t.title}</h4>
                            <p>+${t.reward} DCOIN</p>
                            <button class="btn-do" onclick="window.open('${t.link}', '_blank')">
                                Làm nhiệm vụ (${t.currentCount}/${t.limit})
                            </button>
                        </div>
                    `).join('');
                } else {
                    container.innerHTML = `<p style="text-align: center; padding: 20px;">Hiện chưa có nhiệm vụ nào!</p>`;
                }
            } catch (err) {
                console.error(err);
                document.getElementById('tasks-container').innerHTML = `<p style="text-align: center; color: #ef4444; padding: 20px;">Lỗi kết nối API Server!</p>`;
            }
        }

        initApp();
    </script>
</body>
</html>
