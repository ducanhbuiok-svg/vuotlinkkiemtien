<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>DCOIN Mini App VIP</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    body {
      background: radial-gradient(circle at top, #1e1b4b, #0f172a, #020617);
      color: #f8fafc;
      font-family: system-ui, -apple-system, sans-serif;
      user-select: none;
      -webkit-user-select: none;
    }
    .glass-card {
      background: rgba(30, 41, 59, 0.6);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    .glow-gold {
      box-shadow: 0 0 20px rgba(234, 179, 8, 0.25);
    }
    .tab-content { display: none; }
    .tab-content.active { display: block; }
  </style>
</head>
<body class="min-h-screen pb-24">

  <!-- TOP HEADER USER PROFILE -->
  <div class="sticky top-0 z-50 glass-card border-b border-slate-700/50 p-4 flex justify-between items-center shadow-lg">
    <div class="flex items-center gap-3">
      <img id="user-avatar" src="https://ui-avatars.com/api/?name=User&background=6366f1&color=fff" class="w-11 h-11 rounded-full border-2 border-indigo-500 shadow-md">
      <div>
        <h4 id="user-name" class="font-bold text-sm text-slate-100 flex items-center gap-1.5">
          Khách hàng <i class="fa-solid fa-circle-check text-blue-400 text-xs"></i>
        </h4>
        <p class="text-xs text-slate-400">ID: <span id="user-id" class="font-mono text-indigo-300">-----</span></p>
      </div>
    </div>
    <div class="bg-gradient-to-r from-amber-500/20 to-yellow-500/20 border border-yellow-500/40 px-3 py-1.5 rounded-2xl flex items-center gap-2 glow-gold">
      <i class="fa-solid fa-coins text-yellow-400 text-base animate-pulse"></i>
      <span id="user-balance" class="font-extrabold text-yellow-400 text-sm">0</span>
      <span class="text-[10px] font-bold text-yellow-500/80">DCOIN</span>
    </div>
  </div>

  <!-- MAIN CONTAINER -->
  <div class="p-4 max-w-md mx-auto space-y-4">

    <!-- TAB 1: TRANG CHỦ & NHIỆM VỤ -->
    <div id="tab-home" class="tab-content active space-y-4">
      
      <!-- CARD THỐNG KÊ -->
      <div class="grid grid-cols-2 gap-3">
        <div class="glass-card p-4 rounded-2xl">
          <p class="text-xs text-slate-400 font-medium">Link đã vượt</p>
          <h3 id="stat-links" class="text-xl font-bold text-emerald-400 mt-1">0</h3>
        </div>
        <div class="glass-card p-4 rounded-2xl">
          <p class="text-xs text-slate-400 font-medium">Trạng thái Anti-Cheat</p>
          <h3 class="text-xs font-bold text-indigo-400 mt-2 flex items-center gap-1">
            <i class="fa-solid fa-shield-halved text-emerald-400"></i> HMAC Active
          </h3>
        </div>
      </div>

      <!-- NHIỆM VỤ VƯỢT LINK -->
      <div class="glass-card p-5 rounded-2xl space-y-3">
        <div class="flex justify-between items-center">
          <h3 class="font-bold text-sm text-yellow-400 flex items-center gap-2">
            <i class="fa-solid fa-bolt"></i> Nhiệm vụ Vượt Link VIP
          </h3>
          <span class="text-[10px] bg-indigo-500/30 text-indigo-300 px-2 py-0.5 rounded-full border border-indigo-500/30">+1,000 DCOIN</span>
        </div>
        <p class="text-xs text-slate-300 leading-relaxed">Vượt link rút gọn để nhận ngay thưởng DCOIN trực tiếp vào ví hệ thống.</p>
        <button onclick="startTask()" class="w-full bg-gradient-to-r from-yellow-500 to-amber-600 hover:from-yellow-400 hover:to-amber-500 text-slate-950 font-extrabold py-3 rounded-xl text-sm shadow-lg active:scale-95 transition">
          🚀 BẮT ĐẦU VƯỢT LINK
        </button>
      </div>

    </div>

    <!-- TAB 2: RÚT TIỀN (WITHDRAW) -->
    <div id="tab-withdraw" class="tab-content space-y-4">
      <div class="glass-card p-5 rounded-2xl space-y-4">
        <h3 class="font-bold text-base text-slate-100 flex items-center gap-2">
          <i class="fa-solid fa-wallet text-indigo-400"></i> Rút Tiền Về Ví
        </h3>
        
        <div class="space-y-1">
          <label class="text-xs text-slate-400">Số lượng DCOIN cần rút (Tối thiểu 10,000)</label>
          <input id="withdraw-amount" type="number" placeholder="Ví dụ: 10000" class="w-full bg-slate-900/80 border border-slate-700 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-indigo-500">
        </div>

        <div class="space-y-1">
          <label class="text-xs text-slate-400">Thông tin Ngân Hàng / Ví MoMo</label>
          <input id="withdraw-wallet" type="text" placeholder="STK - Tên Ngân Hàng - Tên Chủ TK" class="w-full bg-slate-900/80 border border-slate-700 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-indigo-500">
        </div>

        <button onclick="submitWithdraw()" class="w-full bg-gradient-to-r from-indigo-500 to-purple-600 hover:from-indigo-400 hover:to-purple-500 text-white font-bold py-3 rounded-xl text-sm shadow-lg active:scale-95 transition">
          XÁC NHẬN RÚT TIỀN
        </button>
      </div>
    </div>

  </div>

  <!-- BOTTOM NAVIGATION BAR -->
  <div class="fixed bottom-0 left-0 right-0 glass-card border-t border-slate-800 p-2 flex justify-around items-center z-50">
    <button onclick="switchTab('home')" id="nav-home" class="flex flex-col items-center gap-1 text-xs text-yellow-400 font-bold">
      <i class="fa-solid fa-house text-lg"></i> Trang Chủ
    </button>
    <button onclick="switchTab('withdraw')" id="nav-withdraw" class="flex flex-col items-center gap-1 text-xs text-slate-400 hover:text-slate-200">
      <i class="fa-solid fa-money-bill-transfer text-lg"></i> Rút Tiền
    </button>
  </div>

  <script>
    const BACKEND_URL = "https://dcoin-bot.onrender.com";

    function initApp() {
      const tg = window.Telegram?.WebApp;
      if (tg) {
        try {
          tg.ready();
          tg.expand();
        } catch(e) {}

        const user = tg.initDataUnsafe?.user;
        if (user) {
          const fullName = (user.first_name || '') + (user.last_name ? ' ' + user.last_name : '');
          document.getElementById('user-name').innerHTML = (fullName || 'Người dùng') + ' <i class="fa-solid fa-circle-check text-blue-400 text-xs"></i>';
          document.getElementById('user-id').innerText = user.id || '-----';
          if (user.photo_url) {
            document.getElementById('user-avatar').src = user.photo_url;
          }
        }
      }
      loadUserData();
    }

    async function loadUserData() {
      const tg = window.Telegram?.WebApp;
      if (!tg?.initData) return;

      try {
        const res = await fetch(`${BACKEND_URL}/api/user-info`, {
          method: "POST",
          headers: { "X-TG-Data": tg.initData }
        });

        if (res.ok) {
          const data = await res.json();
          document.getElementById('user-balance').innerText = Number(data.balance || 0).toLocaleString();
          document.getElementById('stat-links').innerText = data.total_links || 0;
        }
      } catch (err) {}
    }

    async function submitWithdraw() {
      const tg = window.Telegram?.WebApp;
      const amount = parseFloat(document.getElementById('withdraw-amount').value);
      const wallet = document.getElementById('withdraw-wallet').value.trim();

      if (!amount || amount < 10000) return alert("Số tiền rút tối thiểu là 10,000 DCOIN!");
      if (!wallet) return alert("Vui lòng nhập đầy đủ thông tin nhận tiền!");

      try {
        const res = await fetch(`${BACKEND_URL}/api/withdraw`, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "X-TG-Data": tg ? tg.initData : ""
          },
          body: JSON.stringify({ amount: amount, wallet_info: wallet })
        });

        const data = await res.json();
        alert(data.message);
        if (data.success) {
          document.getElementById('withdraw-amount').value = '';
          document.getElementById('withdraw-wallet').value = '';
          loadUserData();
        }
      } catch (e) {
        alert("Lỗi kết nối máy chủ! Vui lòng thử lại.");
      }
    }

    function switchTab(tab) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
      document.getElementById(`tab-${tab}`).classList.add('active');
      
      document.getElementById('nav-home').className = tab === 'home' ? 'flex flex-col items-center gap-1 text-xs text-yellow-400 font-bold' : 'flex flex-col items-center gap-1 text-xs text-slate-400';
      document.getElementById('nav-withdraw').className = tab === 'withdraw' ? 'flex flex-col items-center gap-1 text-xs text-yellow-400 font-bold' : 'flex flex-col items-center gap-1 text-xs text-slate-400';
    }

    function startTask() {
      const tg = window.Telegram?.WebApp;
      if (tg) {
        tg.openLink('https://your-shortlink-domain.com');
      } else {
        window.open('https://your-shortlink-domain.com', '_blank');
      }
    }

    // Chạy ngay khi tải xong
    document.addEventListener("DOMContentLoaded", initApp);
    if (document.readyState === "interactive" || document.readyState === "complete") {
      initApp();
    }
  </script>
</body>
</html>
